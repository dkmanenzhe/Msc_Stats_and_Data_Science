<header id="title-block-header" class="quarto-title-block cover-page">
  <img class="cover-logo" src="UCT_Logo.jpg" alt="University of Cape Town logo">
  <h1 class="title">$title$</h1>
$if(subtitle)$
  <p class="subtitle lead">$subtitle$</p>
$endif$
  <hr>
  <div class="cover-authors">
    <span class="cover-label">Authors:</span>
    <table>
      <tr><td>Dakalo Manenzhe</td><td>MNNDAK002</td></tr>
      <tr><td>Troy Bisnath</td><td>BSNTRO001</td></tr>
    </table>
  </div>
$if(date)$
  <p class="cover-date">$date$</p>
$endif$
</header>
